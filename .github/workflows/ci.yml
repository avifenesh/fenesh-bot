name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Public repo: GitHub-hosted runners are free (private repos use the self-hosted pool).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: tests (queue test starts its own Valkey)
        run: |
          command -v valkey-server >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq valkey-server)
          npm test
